# Publica a pasta site/ no GitHub Pages.
# Uma vez só, no GitHub: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; a que está no meio termina antes da próxima começar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Empacotar a pasta site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
